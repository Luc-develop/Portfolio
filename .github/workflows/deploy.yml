name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Nuxt 4.4 exige ^22.12 || ^24.11 || >=26 : sous Node 20, npm n'émettait que des
          # avertissements, mais le build s'exécutait sur un moteur non supporté.
          node-version: 22
          cache: npm
      # Le lock est produit par npm 11, qui n'inscrit pas les dépendances de pair des
      # copies imbriquées ; npm 10 les réclame et refuse alors d'installer. Il faut donc la
      # même majeure que celle qui a généré le fichier.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
